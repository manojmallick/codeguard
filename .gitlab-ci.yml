# Drop this into a target repo to make CodeGuard a blocking CI gate.
# Set CI/CD variables CODEGUARD_URL and CODEGUARD_TOKEN (Settings → CI/CD → Variables).
dora_compliance:
  stage: test
  image: alpine:3
  before_script:
    - apk add --no-cache curl
  script:
    - |
      RESULT=$(curl -s -X POST "$CODEGUARD_URL/api/pipeline-check" \
        -H "Authorization: Bearer $CODEGUARD_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"project_id\":\"$CI_PROJECT_ID\",\"mr_iid\":\"$CI_MERGE_REQUEST_IID\"}")
      echo "CodeGuard → $RESULT"
      echo "$RESULT" | grep -q '"passed":true' \
        || { echo "❌ DORA Art.9 compliance check FAILED — merge blocked by CodeGuard"; exit 1; }
      echo "✅ DORA Art.9 compliance passed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: false
